name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist). Leave empty for a snapshot dry-run that builds artifacts without creating a GitHub release.'
        required: false

permissions:
  contents: write

jobs:
  build-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Load secrets needed for codesigning + notarization from 1Password.
      # Expects two items under the "CI" vault:
      #   - "Developer ID Application" with fields:
      #       certificate  (base64-encoded .p12 contents)
      #       password     (passphrase for the .p12)
      #       identity     (e.g. "Developer ID Application: Foo (TEAMID)")
      #   - "App Store Connect API Key" with fields:
      #       key_id       (10-character key identifier)
      #       issuer_id    (UUID)
      #       key          (contents of the .p8 private key file)
      - name: Load Apple signing secrets
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APPLE_DEVID_CERT_P12: op://CI/Developer ID Application/certificate
          APPLE_DEVID_CERT_PASSWORD: op://CI/Developer ID Application/password
          APPLE_DEVID_IDENTITY: op://CI/Developer ID Application/identity
          APPLE_API_KEY_ID: op://CI/App Store Connect API Key/key_id
          APPLE_API_ISSUER_ID: op://CI/App Store Connect API Key/issuer_id
          APPLE_API_KEY: op://CI/App Store Connect API Key/key

      - name: Import Developer ID certificate into temporary keychain
        run: |
          set -eu
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$APPLE_DEVID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVID_CERT_PASSWORD" \
            -T /usr/bin/codesign
          # shellcheck disable=SC2046  # intentional word-splitting: each existing keychain path becomes a separate arg
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm "$RUNNER_TEMP/cert.p12"

      - name: Run GoReleaser (darwin)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --config .goreleaser-darwin.yml --clean ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && '--snapshot' || '' }}

      - name: Notarize signed darwin binary
        run: |
          set -eu
          ARCHIVE=$(ls dist/osquery-extension_*_darwin_all.tar.gz)
          WORK="$RUNNER_TEMP/notarize"
          mkdir -p "$WORK"
          tar -xzf "$ARCHIVE" -C "$WORK" osquery-extension.ext
          # Verify the codesign step above produced a valid signature.
          codesign --verify --strict --verbose=2 "$WORK/osquery-extension.ext"
          # notarytool accepts zip / pkg / dmg; not tar.gz.
          ditto -c -k --keepParent "$WORK/osquery-extension.ext" "$WORK/to-notarize.zip"
          # Provide the .p8 private key to notarytool via file.
          KEY_PATH="$WORK/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY" > "$KEY_PATH"
          xcrun notarytool submit "$WORK/to-notarize.zip" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          rm -f "$KEY_PATH"
          # stapler does not work on bare CLI binaries (Apple supports
          # stapling for .app / .pkg / .dmg only). Gatekeeper performs
          # an online check against Apple's notary service when the
          # binary first runs, so the unmodified signed archive is the
          # final artifact.
          rm -rf "$WORK"

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  build-others:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser (linux+windows)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --config .goreleaser-others.yml --clean ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && '--snapshot' || '' }}

      - name: Upload linux+windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-others
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [build-darwin, build-others]
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download darwin artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-darwin
          path: release-artifacts

      - name: Download linux+windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-others
          path: release-artifacts

      - name: Generate combined checksums
        working-directory: release-artifacts
        run: sha256sum -- *.tar.gz *.zip > checksums.txt

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            release-artifacts/*
