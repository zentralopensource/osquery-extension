version: 2

project_name: osquery-extension

before:
  hooks:
    - go mod tidy

builds:
  - id: osquery-extension
    main: ./
    binary: osquery-extension.ext
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE.txt
      - README.md
      - src: tables/fleetdm/LICENSE
        dst: licenses
        strip_parent: true
      - src: tables/fleetdm/ATTRIBUTION.md
        dst: licenses
        strip_parent: true

# Checksums and the GitHub release itself are produced by the final
# release job after combining artifacts from build-darwin + build-others.
checksum:
  disable: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  disable: true
